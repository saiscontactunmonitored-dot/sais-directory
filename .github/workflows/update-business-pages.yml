name: Update SAIS Business Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: write

jobs:
  update-business-pages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate business pages
        run: python generate-business-pages.py

      - name: Commit updated business pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add business sitemap.xml

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update SAIS business pages"
            git push
          fi
