<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somerset Animal Business Directory - Somerset Animal Information Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="w-full py-6 px-8 border-b border-slate-800 flex flex-col md:flex-row items-center justify-between gap-4">
        <div class="text-center md:text-left">
            <h1 class="text-2xl font-bold tracking-tight text-white">Somerset Animal Business Directory</h1>
            <p class="text-sm text-red-500 font-medium mt-1 tracking-wide uppercase">Somerset Animal Information Services</p>
        </div>
        <div class="flex items-center gap-4">
            <a href="login.html" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white font-medium text-sm px-4 py-2.5 rounded-xl transition-colors">
                Business Portal Login
            </a>
            <a href="register.html" class="bg-red-600 hover:bg-red-500 text-white font-medium text-sm px-4 py-2.5 rounded-xl transition-colors shadow-lg shadow-red-600/20">
                Register / Claim Business
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-8">
        
        <!-- Search & Filters -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 mb-8 shadow-xl">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Search Directory</label>
                    <input type="text" id="searchInput" placeholder="Search by name, service..." oninput="filterDirectory()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-red-500 transition-colors text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Filter by Town / Area</label>
                    <select id="townFilter" onchange="filterDirectory()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-red-500 transition-colors text-sm">
                        <option value="">All Towns / Areas</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Filter by Category</label>
                    <select id="categoryFilter" onchange="filterDirectory()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-red-500 transition-colors text-sm">
                        <option value="">All Categories</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loadingState" class="text-center py-20">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-red-500 border-t-transparent"></div>
            <p class="text-slate-400 text-sm mt-4">Loading animal directory listings...</p>
        </div>

        <!-- Directory Grid -->
        <div id="directoryGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
            <!-- Dynamically populated cards go here -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-20 bg-slate-800/50 border border-slate-700/50 rounded-2xl">
            <p class="text-slate-400 text-base font-medium">No businesses found matching your criteria.</p>
            <button onclick="resetFilters()" class="mt-4 text-red-400 hover:text-red-300 text-sm font-medium transition-colors">Clear filters</button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full py-6 px-8 text-center border-t border-slate-800 text-xs text-slate-500">
        <p>&copy; 2026 Somerset Animal Information Services. All rights reserved.</p>
    </footer>

    <!-- Script Logic -->
    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyFjoMUErvU-WySAPtwL33MNYc8uxaoz2GOoCV6n8rRV2iiDwHssMDDV2cGABCuoeGK/exec';

        let allBusinesses = [];

        window.addEventListener('DOMContentLoaded', () => {
            fetchDirectoryData();
        });

        function fetchDirectoryData() {
            const url = new URL(SCRIPT_URL);
            url.searchParams.append('action', 'getDirectory');

            const callbackName = 'jsonp_cb_' + Math.round(100000 * Math.random());
            url.searchParams.append('callback', callbackName);

            window[callbackName] = function(response) {
                delete window[callbackName];
                document.body.removeChild(script);
                
                document.getElementById('loadingState').classList.add('hidden');
                
                if (response && response.businesses) {
                    allBusinesses = response.businesses;
                    populateDropdowns(allBusinesses);
                    renderDirectory(allBusinesses);
                } else {
                    showError('Failed to load directory data.');
                }
            };

            const script = document.createElement('script');
            script.src = url.toString();
            script.onerror = function() {
                delete window[callbackName];
                document.body.removeChild(script);
                document.getElementById('loadingState').classList.add('hidden');
                showError('Network connection failed. Could not load directory.');
            };
            document.body.appendChild(script);
        }

        function populateDropdowns(businesses) {
            const townsSet = new Set();
            const categoriesSet = new Set();

            businesses.forEach(b => {
                const town = b['Area / Town'] || b['Town'] || b['Location'] || '';
                const category = b['Category'] || '';
                if (town) townsSet.add(town);
                if (category) categoriesSet.add(category);
            });

            const townSelect = document.getElementById('townFilter');
            Array.from(townsSet).sort().forEach(town => {
                const opt = document.createElement('option');
                opt.value = town;
                opt.textContent = town;
                townSelect.appendChild(opt);
            });

            const catSelect = document.getElementById('categoryFilter');
            Array.from(categoriesSet).sort().forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                catSelect.appendChild(opt);
            });
        }

        function renderDirectory(businesses) {
            const grid = document.getElementById('directoryGrid');
            const emptyState = document.getElementById('emptyState');
            grid.innerHTML = '';

            if (businesses.length === 0) {
                grid.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            grid.classList.remove('hidden');

            businesses.forEach(b => {
                const name = b['Business Name'] || b['Name'] || 'Unnamed Business';
                const category = b['Category'] || 'Animal Service';
                const town = b['Area / Town'] || b['Town'] || b['Location'] || 'Somerset';
                const description = b['Description'] || 'No description provided.';
                const phone = b['Phone'] || '';
                const email = b['Email'] || '';
                const website = b['Website'] || '';
                const facebook = b['Facebook'] || '';
                const instagram = b['Instagram'] || '';

                const card = document.createElement('div');
                card.className = 'bg-slate-800 border border-slate-700 rounded-2xl p-6 flex flex-col justify-between shadow-lg hover:border-slate-600 transition-all';

                let linksHtml = '';
                if (website) linksHtml += `<a href="${website}" target="_blank" class="text-xs text-red-400 hover:text-red-300 font-medium">Website</a>`;
                if (facebook) linksHtml += `<a href="${facebook}" target="_blank" class="text-xs text-red-400 hover:text-red-300 font-medium">Facebook</a>`;
                if (instagram) linksHtml += `<a href="${instagram}" target="_blank" class="text-xs text-red-400 hover:text-red-300 font-medium">Instagram</a>`;

                card.innerHTML = `
                    <div>
                        <div class="flex items-start justify-between gap-2 mb-3">
                            <h3 class="text-lg font-bold text-white">${escapeHtml(name)}</h3>
                            <span class="bg-red-500/10 text-red-400 text-xs font-semibold px-2.5 py-1 rounded-lg border border-red-500/20 whitespace-nowrap">${escapeHtml(category)}</span>
                        </div>
                        <p class="text-xs text-slate-400 font-medium mb-3">📍 ${escapeHtml(town)}</p>
                        <p class="text-sm text-slate-300 mb-4 line-clamp-3">${escapeHtml(description)}</p>
                    </div>
                    <div class="pt-4 border-t border-slate-700/60 flex flex-col gap-2">
                        ${phone ? `<p class="text-xs text-slate-400">📞 <a href="tel:${phone}" class="hover:text-white">${escapeHtml(phone)}</a></p>` : ''}
                        ${email ? `<p class="text-xs text-slate-400">✉️ <a href="mailto:${email}" class="hover:text-white">${escapeHtml(email)}</a></p>` : ''}
                        ${linksHtml ? `<div class="flex items-center gap-4 mt-2 pt-2 border-t border-slate-700/30">${linksHtml}</div>` : ''}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterDirectory() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const selectedTown = document.getElementById('townFilter').value;
            const selectedCategory = document.getElementById('categoryFilter').value;

            const filtered = allBusinesses.filter(b => {
                const name = (b['Business Name'] || b['Name'] || '').toLowerCase();
                const desc = (b['Description'] || '').toLowerCase();
                const town = b['Area / Town'] || b['Town'] || b['Location'] || '';
                const category = b['Category'] || '';

                const matchesQuery = !query || name.includes(query) || desc.includes(query);
                const matchesTown = !selectedTown || town === selectedTown;
                const matchesCategory = !selectedCategory || category === selectedCategory;

                return matchesQuery && matchesTown && matchesCategory;
            });

            renderDirectory(filtered);
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('townFilter').value = '';
            document.getElementById('categoryFilter').value = '';
            renderDirectory(allBusinesses);
        }

        function showError(msg) {
            const grid = document.getElementById('directoryGrid');
            grid.classList.remove('hidden');
            grid.innerHTML = `<div class="col-span-full text-center py-10 bg-red-500/10 border border-red-500/20 rounded-2xl text-red-400 text-sm font-medium">${msg}</div>`;
        }

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
